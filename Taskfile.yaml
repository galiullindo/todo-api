version: '3'

vars:
  VERSION: 
     sh: 'git describe --tags 2>/dev/null || echo "dev"'
  NAME: todo-api

  MIGRATE_VERSION: 'v4.20.1'
  MIGRATE_TAG: 'sqlite3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  MIGRATE: '{{.BIN_DIR}}/migrate'

  BUILD_DIR: '{{.ROOT_DIR}}/build'
  CMD_DIR: '{{.ROOT_DIR}}/cmd'
  CONFIGS_DIR: '{{.ROOT_DIR}}/configs'
  MIGRATIONS_DIR: '{{.ROOT_DIR}}/db/migrations'
  
  DATA_DIR: '{{.ROOT_DIR}}/data'
  DB_FILE: '{{ index (dict "test" "test.db") (default "prod" .ENV) | default "prod.db" }}'
  DB: '{{.DATA_DIR}}/{{.DB_FILE}}'
  DB_URI: 'sqlite3://{{.DB}}'

tasks:
  install-migrate:
    desc: "Устанавливает утилиту migrate в ./bin"
    cmds: 
      - |
        [ -f {{.MIGRATE}} ] || {
          echo 'Устанавливаем migrate {{.MIGRATE_VERSION}} {{.MIGRATE_TAG}}...'
          GOBIN={{.BIN_DIR}} go install -tags '{{.MIGRATE_TAG}}' github.com/golang-migrate/migrate/v4/cmd/migrate@{{.MIGRATE_VERSION}}
        }
    status:
      - test -x {{.MIGRATE}}
  
  migrate-create:
    desc: "Создает файл миграции .sql"
    deps: [install-migrate]
    cmds:
      - '{{.MIGRATE}} create -ext sql -dir {{.MIGRATIONS_DIR}} {{.name}}'
  
  data-dir:
    internal: true
    cmd: 'mkdir -p {{.DATA_DIR}}'

  migrate-up: 
    desc: "Выполняет миграцию вверх"
    deps: [install-migrate, data-dir]
    cmds:      
      - '{{.MIGRATE}} -path {{.MIGRATIONS_DIR}} -database {{.DB_URI}} up {{.n}}'
    
  migrate-down:
    desc: "Выполняет миграцию вниз"
    deps: [install-migrate, data-dir]
    cmds:
      - '{{.MIGRATE}} -path {{.MIGRATIONS_DIR}} -database {{.DB_URI}} down {{.n}}'
  
  build-dir:
    internal: true
    cmd: 'mkdir -p {{.BUILD_DIR}}'

  build:
    desc: "Выполняет сборку сервиса в ./build"
    deps: [build-dir] 
    cmds:
      - 'go build -o {{.BUILD_DIR}}/server -ldflags="-s -w -X main.Version={{.VERSION}}" {{.CMD_DIR}}/server'
  
  clean: 
    desc: "Удаляет все файлы из ./build"
    deps: [build-dir]
    cmd: rm -r {{.BUILD_DIR}}/*

  deploy:
    deps: [data-dir, build-dir, clean, build] 
    desc: "Выполняет развертывание приложения в ./build"
    cmds:
      - 'task migrate-up'
      - 'mkdir -p {{.BUILD_DIR}}/data'
      - 'ln -sf {{.DATA_DIR}}/prod.db {{.BUILD_DIR}}/data/{{.DB_FILE}}'
      - 'cp -r {{.CONFIGS_DIR}} {{.BUILD_DIR}}/configs'

  docker-build:
    desc: "Выполняет сборку docker образа"
    preconditions:
      - sh: command -v docker
        msg: "Docker не установлен..."
    cmds: 
      - 'docker build --build-arg VERSION={{.VERSION}} -t {{.NAME}} -t {{.NAME}}:{{.VERSION}} .'

  docker-run:
    desc: "Выполняет создание нового docker контейнера и его запуск"
    preconditions:
      - sh: command -v docker
        msg: "Docker не установлен..."
    cmds:
    - 'docker run -d -p 8080:8080 -v {{.DATA_DIR}}:/usr/local/share --name {{.NAME}}-{{.VERSION}} {{.NAME}}:{{.VERSION}}'
