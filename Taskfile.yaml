version: '3'

vars:
  APP_VERSION: 
     sh: 'git describe --tags 2>/dev/null || echo "dev"'
  APP_NAME: todolist

  MIGRATE_VERSION: 'v4.20.1'
  MIGRATE_TAG: 'sqlite3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  MIGRATE: '{{.BIN_DIR}}/migrate'

  BUILD_DIR: '{{.ROOT_DIR}}/build'
  CMD_DIR: '{{.ROOT_DIR}}/cmd'
  CONFIGS_DIR: '{{.ROOT_DIR}}/configs'
  MIGRATIONS_DIR: '{{.ROOT_DIR}}/db/migrations'
  
  DATA_DIR: '{{.ROOT_DIR}}/data'
  DB_FILE: '{{ index (dict "test" "test.db" "docker" "docker.db") (default "prod" .ENV) | default "prod.db" }}'
  DB_PATH: '{{.DATA_DIR}}/{{.DB_FILE}}'
  DB_URI: 'sqlite3://{{.DB_PATH}}'

tasks:
  install-migrate:
    desc: "Устанавливает утилиту migrate в ./bin"
    cmds: 
      - |
        [ -f {{.MIGRATE}} ] || {
          echo 'Устанавливаем migrate {{.MIGRATE_VERSION}} {{.MIGRATE_TAG}}...'
          GOBIN={{.BIN_DIR}} go install -tags '{{.MIGRATE_TAG}}' github.com/golang-migrate/migrate/v4/cmd/migrate@{{.MIGRATE_VERSION}}
        }
    status:
      - test -x {{.MIGRATE}}
  
  migrate-create:
    desc: "Создает файл миграции .sql"
    deps: [install-migrate]
    cmds:
      - '{{.MIGRATE}} create -ext sql -dir {{.MIGRATIONS_DIR}} {{.name}}'
  
  data-dir:
    internal: true
    cmd: 'mkdir -p {{.DATA_DIR}}'

  migrate-up: 
    desc: "Выполняет миграцию вверх"
    deps: [install-migrate, data-dir]
    cmd: '{{.MIGRATE}} -path {{.MIGRATIONS_DIR}} -database {{.DB_URI}} up {{.CLI_ARGS}}'
    
  migrate-down:
    desc: "Выполняет миграцию вниз"
    deps: [install-migrate, data-dir]
    cmd: '{{.MIGRATE}} -path {{.MIGRATIONS_DIR}} -database {{.DB_URI}} down {{.CLI_ARGS}}'
  
  build-dir:
    internal: true
    cmd: 'mkdir -p {{.BUILD_DIR}}'

  build:
    desc: "Выполняет сборку todolist rest api в ./build"
    deps: [build-dir] 
    cmd: 'go build -o {{.BUILD_DIR}}/{{.APP_NAME}} -ldflags="-s -w -X main.Version={{.APP_VERSION}}" {{.CMD_DIR}}/{{.APP_NAME}}'
  
  run:
    desc: "Выполняет запуск todolist rest api из ./build"
    deps: [build]
    vars:
      env: default
    cmd: '{{.BUILD_DIR}}/{{.APP_NAME}} --env={{.env}} --configs-dir={{.CONFIGS_DIR}}'

  e2e-test:
    desc: "Выполняет запуск e2e-тестов"
    cmd: 'go test -v -cover -run TestAPI ./internal/tests/... -- --configs-dir={{.CONFIGS_DIR}}'




  # переделать
  clean: 
    desc: "Удаляет все файлы из ./build"
    deps: [build-dir]
    cmd: rm -r {{.BUILD_DIR}}/*

  # переделать
  deploy:
    deps: [data-dir, build-dir] 
    desc: "Выполняет развертывание приложения в ./build"
    cmds:
      - 'task clean'
      - 'task build'
      - 'task migrate-up'
      - 'mkdir -p {{.BUILD_DIR}}/data'
      - 'ln -sf {{.DATA_DIR}}/prod.db {{.BUILD_DIR}}/data/{{.DB_FILE}}'
      - 'cp -r {{.CONFIGS_DIR}} {{.BUILD_DIR}}/configs'

  # переделать
  docker-build:
    desc: "Выполняет сборку docker образа"
    preconditions:
      - sh: command -v docker
        msg: "Docker не установлен..."
    cmds: 
      - 'docker build --build-arg VERSION={{.APP_VERSION}} -t {{.APP_NAME}} -t {{.APP_NAME}}:{{.APP_VERSION}} .'

  # переделать
  docker-run:
    desc: "Выполняет создание нового docker контейнера и его запуск"
    preconditions:
      - sh: command -v docker
        msg: "Docker не установлен..."
    cmds:
    - 'docker run -d -p 8080:8080 -v {{.DATA_DIR}}:/usr/local/share --name {{.APP_NAME}}-{{.APP_VERSION}} {{.APP_NAME}}:{{.APP_VERSION}}'

